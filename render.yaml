services:
  - type: web
    name: careerpulse-ai
    env: node
    rootDir: job-tracker
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: careerpulse-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false

databases:
  - name: careerpulse-db
    databaseName: careerpulse
    user: careerpulse_user
